name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run end-to-end tests
        run: |
          set -euo pipefail
          npm start > /tmp/pemilihan-rt-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:8787/api/state >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Server berhenti sebelum siap:"
              cat /tmp/pemilihan-rt-server.log
              exit 1
            fi
            sleep 0.2
          done

          curl --fail --silent http://127.0.0.1:8787/api/state >/dev/null
          npm run test:e2e

      - name: Run crash recovery tests
        run: npm run test:crash

      - name: Build Docker image
        run: docker build -t pemilihan-rt:ci .

  preflight:
    name: Check deploy secrets
    needs: verify
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -euo pipefail

          required=(VPS_HOST VPS_USER VPS_APP_DIR VPS_SSH_KEY VPS_KNOWN_HOSTS TAILSCALE_AUTHKEY)
          missing=""
          set_count=0
          for name in "${required[@]}"; do
            if [ -n "${!name}" ]; then
              set_count=$((set_count + 1))
            else
              missing="$missing $name"
            fi
          done

          # Belum ada konfigurasi sama sekali: deploy memang tidak diaktifkan.
          if [ "$set_count" -eq 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy dilewati: belum ada secret deploy yang dikonfigurasi."
            exit 0
          fi

          # Konfigurasi parsial harus gagal terang, bukan dilewati diam-diam.
          if [ -n "$missing" ]; then
            echo "::error::Secret deploy belum lengkap:$missing. Deploy memakai Tailscale karena VPS tidak punya IP publik; lengkapi semua secret tersebut (VPS_PORT opsional, default 22)."
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Secret deploy lengkap; runner akan masuk ke VPS lewat Tailnet."

  deploy:
    name: Deploy to VPS
    needs: [verify, preflight]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # VPS berada di balik NAT tanpa IP publik; runner masuk lewat Tailnet
      # menggunakan IP privat Tailscale (100.x.y.z) sebagai VPS_HOST.
      - name: Connect to Tailscale
        if: env.TAILSCALE_AUTHKEY != ''
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}

      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull and restart on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "${VPS_PORT:-22}" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$VPS_APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail

          if [ ! -d "$APP_DIR/.git" ]; then
            echo "Folder deploy tidak ditemukan atau bukan repo git: $APP_DIR" >&2
            exit 1
          fi

          cd "$APP_DIR"
          echo "== Sebelum: $(git rev-parse --short HEAD) =="

          git fetch --prune origin main
          git pull --ff-only origin main

          if [ ! -f .env ]; then
            echo "PERINGATAN: .env tidak ada, docker-compose memakai nilai bawaan" >&2
          fi

          docker compose up -d --build
          docker compose ps

          echo "== Sesudah: $(git rev-parse --short HEAD) =="

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/api/state >/dev/null; then
              echo "Health check OK"
              exit 0
            fi
            sleep 1
          done

          echo "Health check gagal, log terakhir:" >&2
          docker compose logs --tail 50 >&2
          exit 1
          REMOTE

      - name: Clean old images
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/id_deploy -p "${VPS_PORT:-22}" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" "docker image prune -f"
