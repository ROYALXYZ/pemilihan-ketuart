<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        var theme = 'system';
        try {
          var saved = localStorage.getItem('rt-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch (error) {
          // Penyimpanan mungkin diblokir; gunakan preferensi sistem.
        }
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0b0b0b' : '#ffffff');
      }());
    </script>
    <meta name="description" content="Papan hitung suara digital pemilihan Ketua RT." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Penghitungan Suara · Pemilihan Ketua RT</title>
  </head>
  <body>
    <!--
THESIS: Digital official recap sheet (plano rekapitulasi) for in-person neighborhood RT elections, rejecting generic SaaS dashboards in favor of large tabular numerals, crisp ink rules, and instant operator keyboard entry.
OWN-WORLD: Bright paper-white sheet (#FDFBF7) framed by subtle warm neutral ground (#EFECE6), deep charcoal ink (#18181B) for maximum contrast, muted sage hairline rules (#D4D0C8), and a focused forest green (#15803D) reserved strictly for live status, lead indicator, and operator increment actions.
STORY: Residents on projector or mobile phone watch votes tally live with zero delay and clear percentage proportions; the single operator inputs each announced vote in under 1 second via keyboard (1-6) or tactile touch buttons with full undo safety.
FIRST VIEWPORT: Centered official plano sheet: masthead with RT/RW and live status chip, dominant "SUARA MASUK" counter with timestamp, followed by 6 candidate rows with boxed numbers 01-06, names, proportion bars, and giant tabular vote numerals, plus operator controls and audit log when authorized.
FORM: Plano Rekap Resmi (derived from physical C1/recap sheet ritual) raised with split-flap cell stability and warm consumer tactile precision; seed 7f5278c5.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
